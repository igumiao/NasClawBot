[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fnos-media-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "starlette>=0.46,<1.0",
  "anyio>=4.0,<4.13",
  "uvicorn>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "python-dotenv>=1.0,<2.0",
  "httpx>=0.27,<0.28",
  "openai>=2.0,<3.0",
  "qbittorrent-api>=2025.5.0,<2026.0.0",
  "tiktoken>=0.7,<1.0",
  "pyyaml>=6.0,<7.0",
  "mcp>=1.8.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
include = ["app*", "evals*", "hello_agents*"]
namespaces = true

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
