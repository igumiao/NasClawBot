id: batch-download-notify
title: 批量下载并通知
category: download_intent
tags:
- download
- batch
- approval
- notify
steps:
- kind: user
  text: 同时下载 torrent 101 和 torrent 102，完成后通知我
- kind: assert
  status: awaiting_approval
  required_calls:
  - name: qb_add_torrents
    arguments:
      completion_action: notify
      items:
      - torrent_id: '101'
      - torrent_id: '102'
  exact_call_count:
    qb_add_torrents: 1
  forbidden_calls:
  - qb_add_torrent
  recorded_effects: 0
- kind: approve
- kind: assert
  recorded_effects: 2
  final_facts:
  - submitted_paused
