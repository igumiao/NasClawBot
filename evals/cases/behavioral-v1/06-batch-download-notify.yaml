id: batch-download-notify
title: 批量下载并通知
category: download_intent
tags:
- download
- batch
- approval
- notify
steps:
- kind: user
  text: 搜索 Inception Interstellar，下载 Inception.2010.2160p.REMUX 和 Interstellar.2014.1080p.BluRay 两个版本 我确认就两个版本都存在并且我都要 你直接下载, 完成后通知我
- kind: assert
  status: awaiting_approval
  required_calls:
  - name: mteam_search
  - name: qb_add_torrent
    arguments:
      completion_action: notify
      items:
      - torrent_id: '104'
      - torrent_id: '105'
  exact_call_count:
    qb_add_torrent: 1
  ordering:
  - before: mteam_search
    after: qb_add_torrent
  forbidden_calls: []
  recorded_effects: 0
- kind: approve
- kind: assert
  recorded_effects: 2
